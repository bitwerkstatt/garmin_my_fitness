[project]
name = "myfitness"
version = "1.1.0"
description = "Persönliche Analyse eigener Garmin-Daten mit Schwerpunkt Laufen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Manthey", email = "mail@thomas-manthey.de" }
]
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python>=1.0.0",
    "garmin-fit-sdk>=21.218.0",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
myfitness = "myfitness.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
]
